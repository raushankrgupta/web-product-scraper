services:
  app:
    image: phikarnot/web-product-scraper:latest
    # The deploy workflow runs `docker compose up -d --build`, but without a
    # `build:` key that flag is a no-op and compose just reuses whatever image
    # is already on the box — so a `git pull` of new source would deploy
    # nothing. Building here from the pulled source is what the workflow
    # already assumes (setup_swap.sh exists for exactly this reason), and it
    # is what lets APP_VERSION reach the binary.
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: web-product-scraper
    restart: always
    # Ports are now handled by Caddy, so we don't expose 8080 directly to the host
    # ports:
    #   - "80:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    # Bound the JSON log file so `docker logs` can't fill the EC2 disk. The
    # app now emits one structured line per request, so volume is higher than
    # it was — 5 × 50MB is roughly a week at current traffic.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
